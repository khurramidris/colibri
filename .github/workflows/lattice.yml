name: Lattice controller and native engines

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/olmoe.c'
      - 'c/replay_oracle.h'
      - 'c/tests/**'
      - 'c/tools/**'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'docs/olmoe-acceptance.md'
      - 'tools/materialize_olmoe_native_contract.py'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/olmoe.c'
      - 'c/replay_oracle.h'
      - 'c/tests/**'
      - 'c/tools/**'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'docs/olmoe-acceptance.md'
      - 'tools/materialize_olmoe_native_contract.py'
      - '.github/workflows/lattice.yml'

permissions:
  contents: read

concurrency:
  group: lattice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed native OLMoE contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_olmoe_native_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''    start_count = text.count(start)
              end_count = text.count(end)
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"{label}: expected unique anchors, found start={start_count} end={end_count}"
                  )
              i = text.index(start)
              j = text.index(end, i)
          '''
          new = '''    start_count = text.count(start)
              if start_count != 1:
                  raise SystemExit(
                      f"{label}: expected one start anchor, found {start_count}"
                  )
              i = text.index(start)
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"{label}: end anchor not found after start anchor")
          '''
          if old not in text:
              raise SystemExit('materializer helper patch anchor not found')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python3 tools/materialize_olmoe_native_contract.py
      - name: Capture materialized sources
        uses: actions/upload-artifact@v4
        with:
          name: materialized-olmoe-contract
          path: |
            c/olmoe.c
            c/Makefile
          if-no-files-found: error
          retention-days: 1
      - name: Validate controller and long oracle artifacts
        run: |
          python3 -m compileall -q lattice c/tools
          python3 -m unittest discover -s lattice/tests -v
          python3 -m lattice --version
      - name: Validate native engines and exact top-k oracle
        run: make -C c check

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice c/tools
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
