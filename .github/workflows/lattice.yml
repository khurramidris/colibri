name: Lattice numerical replay oracle

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - '.github/workflows/lattice.yml'

permissions:
  contents: read

jobs:
  engine-and-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate controller
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
          python3 -m lattice --version
      - name: Validate Colibri engine and oracle
        run: make -C c check

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
