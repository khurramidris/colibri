name: Lattice scalable replay oracle artifacts

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - '.github/workflows/lattice.yml'

permissions:
  contents: read

jobs:
  materialize-reviewed-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/lattice-comprehensive-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-comprehensive-hardening
          fetch-depth: 0
      - name: Detect one-time migration
        id: migration
        shell: bash
        run: |
          if [[ -f tools/materialize_lattice_identity.py ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply reviewed transformations and fixture upgrade
        if: steps.migration.outputs.needed == 'true'
        run: |
          python3 tools/materialize_lattice_identity.py
          python3 tools/materialize_lattice_test_fixtures.py
      - name: Validate transformed Python controller
        if: steps.migration.outputs.needed == 'true'
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
      - name: Validate transformed native engine
        if: steps.migration.outputs.needed == 'true'
        run: make -C c check
      - name: Publish exact tested source
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'lattice-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/materialize_lattice_identity.py tools/materialize_lattice_test_fixtures.py .github/workflows/lattice-hardening-materialize.yml
          git add -A
          git commit -m 'Bind qualification evidence to the frozen execution plan'
          git push origin HEAD:agent/lattice-comprehensive-hardening

  engine-and-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate controller and long oracle artifacts
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
          python3 -m lattice --version
      - name: Validate Colibri engine and exact top-k oracle
        run: make -C c check

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
