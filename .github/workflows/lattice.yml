name: Lattice scalable replay oracle artifacts

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'tools/lattice_oracle_artifacts.py'
      - 'tools/lattice_oracle_artifacts_debug.py'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'tools/lattice_oracle_artifacts.py'
      - 'tools/lattice_oracle_artifacts_debug.py'
      - '.github/workflows/lattice.yml'

permissions:
  contents: write

jobs:
  materialize-artifacts:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/lattice-oracle-artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-oracle-artifacts
          fetch-depth: 0
      - name: Detect staged artifact transport
        id: gate
        shell: bash
        run: |
          [[ -f tools/lattice_oracle_artifacts.py ]] && echo 'enabled=true' >> "$GITHUB_OUTPUT" || echo 'enabled=false' >> "$GITHUB_OUTPUT"
      - name: Apply scalable exact-oracle changes
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 tools/lattice_oracle_artifacts.py
          python3 tools/lattice_oracle_artifacts_debug.py
          rm tools/lattice_oracle_artifacts.py tools/lattice_oracle_artifacts_debug.py
      - name: Validate exact transformed tree
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
          make -C c check
          python3 -m lattice --version
      - name: Publish exact tested source
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name 'lattice-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c/colibri.c c/replay_oracle.h c/tests/test_replay_oracle.c
          git add lattice
          git add -u tools/lattice_oracle_artifacts.py tools/lattice_oracle_artifacts_debug.py
          git commit -m 'engine: move exact replay oracle to bounded artifacts'
          git push origin HEAD:agent/lattice-oracle-artifacts

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
