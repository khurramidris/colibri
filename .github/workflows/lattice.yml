name: Lattice numerical replay oracle

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'tools/lattice_oracle_two_phase.py'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/replay_oracle.h'
      - 'c/tests/test_replay_oracle.c'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'tools/lattice_oracle_two_phase.py'
      - '.github/workflows/lattice.yml'

permissions:
  contents: write

jobs:
  materialize-two-phase:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/lattice-numerical-oracle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-numerical-oracle
          fetch-depth: 0
      - name: Detect staged timing correction
        id: gate
        shell: bash
        run: |
          [[ -f tools/lattice_oracle_two_phase.py ]] && echo 'enabled=true' >> "$GITHUB_OUTPUT" || echo 'enabled=false' >> "$GITHUB_OUTPUT"
      - name: Apply two-phase replay measurement
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 tools/lattice_oracle_two_phase.py
          rm tools/lattice_oracle_two_phase.py
      - name: Validate exact corrected tree
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
          make -C c check
          python3 -m lattice --version
      - name: Publish exact tested correction
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name 'lattice-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c/colibri.c lattice/oracle.py lattice/colibri.py lattice/report.py
          git add lattice/tests/test_colibri.py lattice/tests/test_integration.py LATTICE.md
          git add -u tools/lattice_oracle_two_phase.py
          git commit -m 'engine: isolate numerical oracle from replay timing'
          git push origin HEAD:agent/lattice-numerical-oracle

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
