name: Lattice controller and native engines

on:
  push:
    paths:
      - 'c/colibri.c'
      - 'c/olmoe.c'
      - 'c/replay_oracle.h'
      - 'c/tests/**'
      - 'c/tools/**'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'docs/olmoe-acceptance.md'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'c/colibri.c'
      - 'c/olmoe.c'
      - 'c/replay_oracle.h'
      - 'c/tests/**'
      - 'c/tools/**'
      - 'c/Makefile'
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'docs/olmoe-acceptance.md'
      - '.github/workflows/lattice.yml'

permissions:
  contents: read

concurrency:
  group: lattice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-runtime-isolation:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/lattice-comprehensive-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-comprehensive-hardening
          fetch-depth: 0
      - name: Detect one-time migration
        id: migration
        shell: bash
        run: |
          if [[ -f tools/materialize_runtime_isolation.py ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply reviewed runtime isolation
        if: steps.migration.outputs.needed == 'true'
        run: |
          python3 tools/fix_runtime_migration_escapes.py
          python3 tools/materialize_runtime_isolation.py
      - name: Validate transformed controller and native suite
        if: steps.migration.outputs.needed == 'true'
        run: |
          python3 -m compileall -q lattice c/tools
          python3 -m unittest discover -s lattice/tests -v
          make -C c check
      - name: Publish exact tested source
        if: steps.migration.outputs.needed == 'true'
        run: |
          git config user.name 'lattice-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tools/materialize_runtime_isolation.py tools/fix_runtime_migration_escapes.py
          git add -A
          git commit -m 'Isolate and attest qualification runtime inputs'
          git push origin HEAD:agent/lattice-comprehensive-hardening

  engine-and-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate controller and long oracle artifacts
        run: |
          python3 -m compileall -q lattice c/tools
          python3 -m unittest discover -s lattice/tests -v
          python3 -m lattice --version
      - name: Build OLMoE engine
        run: make -C c olmoe
      - name: Validate Colibri engine and exact top-k oracle
        run: make -C c check

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice c/tools
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
