name: Lattice qualification plane

on:
  push:
    paths:
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'examples/lattice-workload.json'
      - '.github/workflows/lattice.yml'
  pull_request:
    paths:
      - 'lattice/**'
      - 'LATTICE.md'
      - 'docs/lattice-qualification.md'
      - 'examples/lattice-workload.json'
      - '.github/workflows/lattice.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lattice
      - name: Unit and protocol integration tests
        run: python -m unittest discover -s lattice/tests -v
      - name: CLI smoke test
        run: python -m lattice --version
