name: BATS scheduler gate

on:
  push:
    paths:
      - "c/bats.h"
      - "c/olmoe_bats.c"
      - "c/Makefile.bats"
      - "c/tests/test_bats.c"
      - "c/tests/test_bats_replay.py"
      - "c/tests/test_bats_route_trace.py"
      - "c/tests/test_bats_shadow_report.py"
      - "c/tests/bats_trace.jsonl"
      - "c/tools/bats_replay.py"
      - "c/tools/bats_route_trace.py"
      - "c/tools/bats_shadow_report.py"
      - ".github/workflows/bats.yml"
  pull_request:
    paths:
      - "c/bats.h"
      - "c/olmoe_bats.c"
      - "c/Makefile.bats"
      - "c/tests/test_bats.c"
      - "c/tests/test_bats_replay.py"
      - "c/tests/test_bats_route_trace.py"
      - "c/tests/test_bats_shadow_report.py"
      - "c/tests/bats_trace.jsonl"
      - "c/tools/bats_replay.py"
      - "c/tools/bats_route_trace.py"
      - "c/tools/bats_shadow_report.py"
      - ".github/workflows/bats.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C scheduler gate
        run: cc -std=c11 -O2 -Wall -Wextra -Werror c/tests/test_bats.c -o /tmp/test_bats -lm
      - name: Run C scheduler gate
        run: /tmp/test_bats
      - name: Run independent replay oracle
        run: python3 c/tools/bats_replay.py c/tests/bats_trace.jsonl --pretty
      - name: Test replay oracle
        run: python3 c/tests/test_bats_replay.py -v
      - name: Test Colibri route trace adapter
        run: python3 c/tests/test_bats_route_trace.py -v
      - name: Test shadow calibration report
        run: python3 c/tests/test_bats_shadow_report.py -v
      - name: Compile exact OLMoE shadow runtime
        run: make -C c -f Makefile.bats olmoe-bats ARCH=x86-64-v3
