name: Fareed-inspired trunk streaming

on:
  push:
    branches:
      - research/fareed-compressed-trunk-streaming
    paths:
      - "research/fareed/**"
      - ".github/workflows/fareed-trunk-streaming.yml"
  pull_request:
    paths:
      - "research/fareed/**"
      - ".github/workflows/fareed-trunk-streaming.yml"

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest discover -s research/fareed -p 'test_*.py' -v
      - run: >
          python research/fareed/synthetic_trunk.py
          --layers 24
          --width 48
          --resident-layers 7
          --passes 5
      - name: Build native fixture
        env:
          PYTHONPATH: research/fareed
        run: |
          mkdir -p out
          python - <<'PY'
          from synthetic_trunk import make_synthetic_layers, pack_trunk
          pack_trunk(
              "out/native_fixture.bin",
              make_synthetic_layers(n_layers=24, width=48, seed=0),
          )
          PY
      - name: Compile native reader
        run: >
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread
          research/fareed/trunk_stream.c
          research/fareed/test_trunk_stream.c
          -lm -o out/test_trunk_stream
      - name: Run native buffered and direct-I/O differential
        run: ./out/test_trunk_stream out/native_fixture.bin
      - name: Generate tiny real-K3 snapshot
        run: python research/fareed/make_tiny_k3.py out/tiny-k3 --layers 3 --hidden 64
      - name: Compile K3 lifecycle integration
        run: >
          cc -std=c11 -O2 -march=x86-64-v3 -fopenmp -pthread
          -Wall -Wextra -Wno-unused-parameter -Wno-misleading-indentation
          -Wno-unused-function
          research/fareed/k3_stream_lifecycle.c
          -lm -fopenmp -pthread -o out/k3_stream_lifecycle
      - name: Compare resident and streamed real K3 code paths
        run: |
          OMP_NUM_THREADS=2 out/k3_stream_lifecycle \
            out/tiny-k3 out/tiny-k3/x0.f32 out/k3-resident.trace 3 3
          OMP_NUM_THREADS=2 out/k3_stream_lifecycle \
            out/tiny-k3 out/tiny-k3/x0.f32 out/k3-partial.trace 1 3
          OMP_NUM_THREADS=2 out/k3_stream_lifecycle \
            out/tiny-k3 out/tiny-k3/x0.f32 out/k3-streamed.trace 0 3
          cmp out/k3-resident.trace out/k3-partial.trace
          cmp out/k3-resident.trace out/k3-streamed.trace
          test "$(stat -c %s out/k3-resident.trace)" -eq $((3 * 64 * 4))
