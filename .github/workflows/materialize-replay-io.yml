name: Materialize replay I/O accounting

on:
  push:
    branches:
      - agent/lattice-comprehensive-hardening
    paths:
      - tools/materialize_replay_io.py
      - c/replay_io.h
      - c/tests/test_replay_io.c
      - docs/replay-io-baseline.md
      - .github/workflows/materialize-replay-io.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-replay-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-comprehensive-hardening
          fetch-depth: 0
      - name: Materialize reviewed source changes
        run: python3 tools/materialize_replay_io.py
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q 'REPLAY_IO v1 available=' c/colibri.c
          grep -q 'tests/test_replay_io$(EXE)' c/Makefile
      - name: Run native and controller validation
        run: make -C c check
      - name: Preserve materialized source
        uses: actions/upload-artifact@v4
        with:
          name: replay-io-materialized-source
          path: |
            c/colibri.c
            c/Makefile
            c/replay_io.h
            c/tests/test_replay_io.c
            docs/replay-io-baseline.md
      - name: Commit validated permanent source
        env:
          BRANCH: agent/lattice-comprehensive-hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add c/colibri.c c/Makefile c/replay_io.h c/tests/test_replay_io.c docs/replay-io-baseline.md
          git rm tools/materialize_replay_io.py .github/workflows/materialize-replay-io.yml
          git commit -m "feat: measure replay storage read amplification"
          git push origin "HEAD:${BRANCH}"
