name: Materialize reviewed Lattice hardening

on:
  push:
    branches: [agent/lattice-comprehensive-hardening]
    paths:
      - tools/materialize_lattice_identity.py
      - .github/workflows/lattice-hardening-materialize.yml

permissions:
  contents: write

concurrency:
  group: lattice-hardening-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'khurramidris/colibri'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-comprehensive-hardening
          fetch-depth: 0
      - name: Apply reviewed transformations
        run: python3 tools/materialize_lattice_identity.py
      - name: Validate Python controller
        run: |
          python3 -m compileall -q lattice
          python3 -m unittest discover -s lattice/tests -v
      - name: Validate native engine
        run: make -C c check
      - name: Publish exact tested source and remove materializer
        run: |
          git config user.name 'lattice-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/materialize_lattice_identity.py .github/workflows/lattice-hardening-materialize.yml
          git add -A
          git commit -m 'Bind qualification evidence to the frozen execution plan'
          git push origin HEAD:agent/lattice-comprehensive-hardening

# Retry marker: latest strict-JSON and suite-validation head.
